name: Build Android release

# Signed release of the native Android app (native/android) for Google Play.
# Uses the same upload keystore secrets as the former React Native builds, so
# the native app updates the published app in place (same package and key).
# Debug builds and tests run in native-core.yml ("Native apps").

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed Android release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Brand resources are generated from src/brand by native/tools/export-brand.cjs.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Name the artifacts
        # Branch names may contain '/', which is invalid in file and artifact names.
        run: echo "ARTIFACT_NAME=universal-mediasync-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Check tag matches the brand version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./src/brand/brand.config.js').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the brand version v$VERSION (src/brand/brand.config.js)."
            exit 1
          fi

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Strip any whitespace / CR / LF the secret may contain (e.g. base64
          # generated on Windows with CRLF, or pasted with line wraps). Leaving
          # them in corrupts the decoded keystore, which later surfaces as the
          # misleading "keystore password was incorrect" Gradle error.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Verify keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          # sha256 is safe to print and lets us confirm the secret matches the
          # keystore used locally without exposing anything sensitive.
          echo "keystore sha256=$(sha256sum "$KS" | awk '{print $1}')"
          # Fail fast (before Gradle) if the store password or alias does not match.
          if ! keytool -list -keystore "$KS" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS secrets do not match the keystore in ANDROID_KEYSTORE_BASE64. Regenerate the base64 from the correct release.keystore and update the secrets."
            exit 1
          fi
          # Compare with the upload key certificate in Play Console > App integrity.
          keytool -list -v -keystore "$KS" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | grep -E 'SHA256:'

      - name: Build signed release APK + AAB
        working-directory: native/android
        env:
          MEDIASYNC_KEYSTORE: ${{ runner.temp }}/release.keystore
          MEDIASYNC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MEDIASYNC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEDIASYNC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Verify release signatures
        run: |
          OUT=native/android/app/build/outputs
          # Without signing Gradle names the APK app-release-unsigned.apk, and Play rejects unsigned bundles.
          test -f "$OUT/apk/release/app-release.apk" || { echo "::error::Release APK is not signed."; exit 1; }
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$OUT/apk/release/app-release.apk" | grep -E 'SHA-256'
          jarsigner -verify "$OUT/bundle/release/app-release.aab" | grep -q 'jar verified' || { echo "::error::Release AAB is not signed."; exit 1; }
          mkdir -p dist
          cp "$OUT/apk/release/app-release.apk" "dist/$ARTIFACT_NAME.apk"
          cp "$OUT/bundle/release/app-release.aab" "dist/$ARTIFACT_NAME.aab"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload release APK + AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-release
          path: dist/
          retention-days: 30

      - name: Attach APK + AAB to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ env.ARTIFACT_NAME }}.apk
            dist/${{ env.ARTIFACT_NAME }}.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
