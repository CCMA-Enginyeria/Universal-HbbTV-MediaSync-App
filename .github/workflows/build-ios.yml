name: Build iOS release

# Signed App Store build of the native iOS app (native/ios/App), uploaded to
# App Store Connect (TestFlight). Submitting for review stays a manual step in
# App Store Connect. Simulator tests and the unsigned archive run in
# native-core.yml ("Native apps").
#
# Secrets:
#   IOS_DIST_CERT_P12_BASE64      Apple Distribution certificate + private key (.p12), base64
#   IOS_DIST_CERT_PASSWORD        password of the .p12
#   IOS_PROVISIONING_PROFILE_BASE64  App Store profile of the store bundle id, with the
#                                 multicast entitlement (com.apple.developer.networking.multicast), base64
#   APPSTORE_API_KEY_ID           App Store Connect API key id (role App Manager or higher)
#   APPSTORE_API_ISSUER_ID        App Store Connect API issuer id
#   APPSTORE_API_PRIVATE_KEY      contents of AuthKey_<id>.p8

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to App Store Connect (TestFlight)'
        type: boolean
        default: false
      build_number:
        description: 'Build number override (empty: derived from the brand version, e.g. 1.6.0 -> 10600)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build signed iOS release
    runs-on: macos-15
    env:
      UPLOAD: ${{ github.event_name == 'push' || inputs.upload }}
      MEDIASYNC_VERSION_CODE: ${{ inputs.build_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The runner image's default Xcode changes over time; pin the latest stable.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Brand resources are generated from src/brand by native/tools/export-brand.cjs.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Name the artifacts
        # Branch names may contain '/', which is invalid in file and artifact names.
        run: echo "ARTIFACT_NAME=universal-mediasync-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Check tag matches the brand version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./src/brand/brand.config.js').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the brand version v$VERSION (src/brand/brand.config.js)."
            exit 1
          fi

      - name: Install the distribution certificate
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          # Strip whitespace / CRLF the secret may contain (e.g. base64 generated on Windows).
          printf '%s' "$IOS_DIST_CERT_P12_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          if ! security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"; then
            echo "::error::Could not import IOS_DIST_CERT_P12_BASE64 with IOS_DIST_CERT_PASSWORD. Export the Apple Distribution certificate with its private key as .p12."
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q 'Apple Distribution' \
            || { echo "::error::The .p12 does not contain an Apple Distribution identity."; exit 1; }

      - name: Install the provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE="$RUNNER_TEMP/appstore.mobileprovision"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | tr -d '[:space:]' | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          read_profile() { /usr/libexec/PlistBuddy -c "Print :$1" "$RUNNER_TEMP/profile.plist"; }
          UUID=$(read_profile UUID)
          NAME=$(read_profile Name)
          TEAM=$(read_profile TeamIdentifier:0)
          APP_ID=$(read_profile Entitlements:application-identifier)
          BUNDLE_ID=$(node -p "require('./src/brand/brand.config.js').bundleIdentifier")
          if [ "$APP_ID" != "$TEAM.$BUNDLE_ID" ]; then
            echo "::error::The profile is for $APP_ID, expected $TEAM.$BUNDLE_ID."
            exit 1
          fi
          if read_profile ProvisionedDevices >/dev/null 2>&1; then
            echo "::error::The profile lists devices: use an App Store (distribution) profile, not Ad Hoc/Development."
            exit 1
          fi
          # Without the approved entitlement, discovery fails on every real iPhone.
          if [ "$(read_profile Entitlements:com.apple.developer.networking.multicast 2>/dev/null)" != "true" ]; then
            echo "::error::The profile lacks com.apple.developer.networking.multicast. Enable Multicast Networking on the App ID and regenerate the profile."
            exit 1
          fi
          for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$PROFILE" "$DIR/$UUID.mobileprovision"
          done
          echo "Profile '$NAME' ($UUID), team $TEAM, expires $(read_profile ExpirationDate)"
          # Read by Release.xcconfig; only the app target is signed this way.
          cat > native/ios/App/Config/Signing.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $TEAM
          MEDIASYNC_CODE_SIGN_IDENTITY = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = $NAME
          EOF
          echo "TEAM_ID=$TEAM" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          sh native/ios/App/generate.sh

      - name: Archive
        run: |
          xcodebuild -project native/ios/App/MediaSync.xcodeproj -scheme MediaSync \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MediaSync.xcarchive" archive

      - name: Export the IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/MediaSync.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          mkdir -p dist
          cp "$RUNNER_TEMP/export/MediaSync.ipa" "dist/$ARTIFACT_NAME.ipa"
          # Shows the signing team and the entitlements that will reach App Review.
          codesign -dv "$RUNNER_TEMP/MediaSync.xcarchive/Products/Applications/MediaSync.app" 2>&1 | grep -E 'Identifier|TeamIdentifier'
          codesign -d --entitlements - --xml "$RUNNER_TEMP/MediaSync.xcarchive/Products/Applications/MediaSync.app" | plutil -p -

      - name: Upload to App Store Connect
        if: env.UPLOAD == 'true'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          # altool looks the key up by id in ~/.appstoreconnect/private_keys.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$APPSTORE_API_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$APPSTORE_API_KEY_ID.p8"
          xcrun altool --upload-app --type ios --file "dist/$ARTIFACT_NAME.ipa" \
            --apiKey "$APPSTORE_API_KEY_ID" --apiIssuer "$APPSTORE_API_ISSUER_ID"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/appstore.mobileprovision" native/ios/App/Config/Signing.xcconfig
          rm -rf "$HOME/.appstoreconnect/private_keys"

      - name: Upload IPA and dSYMs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-ios
          path: |
            dist/
            ${{ runner.temp }}/MediaSync.xcarchive/dSYMs/
          retention-days: 30
