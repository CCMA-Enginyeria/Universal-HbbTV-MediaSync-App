name: Publish Landing Page and IBC Demonstrations

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-landing-page.yml"
      - "www/landing/**"
      - "www/ibc_demostrations/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website artifact
        shell: bash
        run: |
          mkdir -p dist
          cp -r www/landing/* dist/
          mv dist/code.html dist/index.html
          cp -r www/ibc_demostrations dist/ibc_demostrations
          touch dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
