<!DOCTYPE html>
<html style="height:100%;margin:0;padding:0;background:#000;">

<head>
  <meta charset="UTF-8">
  <title>Basic Media Sync Viewer</title>
  <script>
    (function () {
      var entries = [];
      var MAX_ENTRIES = 100;
      var methods = ['log', 'info', 'warn', 'error', 'debug'];
      var hasError = false;

      function format(value) {
        if (value instanceof Error) {
          return value.stack || value.message || String(value);
        }
        if (typeof value === 'string') { return value; }
        if (typeof value === 'undefined') { return 'undefined'; }
        try { return JSON.stringify(value); }
        catch (error) { return String(value); }
      }

      function render() {
        var output = document.getElementById('s');
        if (!output) { return; }
        output.textContent = entries.join('\n');
        output.style.display = hasError ? 'block' : 'none';
        output.scrollTop = output.scrollHeight;
      }

      for (var i = 0; i < methods.length; i++) {
        (function (method) {
          var original = typeof console[method] === 'function' ? console[method] : null;
          console[method] = function () {
            var parts = [];
            for (var j = 0; j < arguments.length; j++) {
              parts.push(format(arguments[j]));
            }
            entries.push('[' + method.toUpperCase() + '] ' + parts.join(' '));
            if (entries.length > MAX_ENTRIES) { entries.shift(); }
            if (method === 'error') { hasError = true; }
            render();
            if (original) { original.apply(console, arguments); }
          };
        })(methods[i]);
      }

      window.mediaSyncCompatScriptState = 'pending';
      window.onMediaSyncCompatLoad = function () {
        window.mediaSyncCompatScriptState = 'loaded';
        console.log('MediaSyncCompat script loaded; global=' +
          (typeof window.HbbTVMediaSyncCompat) +
          '; start=' + !!(window.HbbTVMediaSyncCompat && window.HbbTVMediaSyncCompat.start));
      };
      window.onMediaSyncCompatError = function () {
        window.mediaSyncCompatScriptState = 'load-error';
        console.error('MediaSyncCompat script load failed; pageProtocol=' + window.location.protocol);
      };
      window.addEventListener('error', function (event) {
        console.error('Window error: ' + (event.message || 'unknown') +
          '; source=' + (event.filename || 'unknown') +
          '; line=' + (event.lineno || 0) + ':' + (event.colno || 0));
      });

      window.addEventListener('DOMContentLoaded', function () {
        render();
        var compatScript = document.getElementById('mediasync-compat-script');
        console.log('MediaSyncCompat diagnostic: state=' + window.mediaSyncCompatScriptState +
          '; global=' + (typeof window.HbbTVMediaSyncCompat) +
          '; pageProtocol=' + window.location.protocol +
          '; scriptSrc=' + (compatScript ? compatScript.src : 'missing'));
      });
    })();
  </script>
  <script src="js/hbbtvlib.js"></script>
  <script src="js/hbbtv-manager-polyfill.js"></script>
  <script id="mediasync-compat-script"
    src="../hbbtv-compat/hbbtv-mediasync-compat.js?version=1.1"
    onload="onMediaSyncCompatLoad()"
    onerror="onMediaSyncCompatError()"></script>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    #v {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #s {
      display: none;
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      max-height: 35%;
      overflow: hidden;
      color: #0f0;
      font-family: monospace;
      font-size: 12px;
      background: rgba(0, 0, 0, 0.7);
      padding: 6px 10px;
      border-radius: 4px;
      z-index: 10;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>
  <div id="s">Loading...</div>
  <video id="v" autoplay>
    <source src="https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd" type="application/dash+xml">
  </video>
  <script>
    var v = document.getElementById('v');
    var s = document.getElementById('s');
    var SEEK_STEP_SECONDS = 10;
    // Cada element pot tenir:
    //   url : MPD DASH que reprodueix la TV (genera el timeline PTS 90 kHz).
    //   web : (opcional) URL d'una web companion (.html) que el segon dispositiu
    //         carregarà a pantalla completa en comptes de reproduir el DASH.
    //         Quan hi ha `web`, s'envia com a contentIdOverride perquè el mòbil
    //         detecti (per l'extensió .html) que ha d'obrir la web sincronitzada.
    //         La TV continua reproduint `url` per mantenir viu el timeline.
    var CONTENTS = [
      { name: 'sagrada_familia', url: 'https://ccma-labs-generic.s3.eu-west-1.amazonaws.com/ibc-2026/_dash_Signes_IBC/manifest_signes.mpd' },
      { name: 'sign_language', url: 'https://ccma-labs-generic.s3.eu-west-1.amazonaws.com/ibc-2026/_dash_Signes_IBC/manifest_signes.mpd' },
      { name: 'Big Buck Bunny', url: 'https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd' },
      { name: 'Envivio', url: 'https://dash.akamaized.net/envivio/EnvivioDash3/manifest.mpd' },
      { name: 'Tears of Steel', url: 'https://dash.akamaized.net/dash264/TestCases/2c/qualcomm/1/MultiResMPEG2.mpd' },
      { name: 'Web Demo (WebXR)', url: 'https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd', web: 'https://3cat-eclipsi.pages.dev/index.html?xr=1' },
      { name: 'Web Demo (WebXR)', url: 'https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd', web: 'sync_app/index.html?xr=1' },
    ];
    var contentIndex = 0;
    var isVideoSelectionLocked = false;
    function hasVideoQueryParameter() {
      return /[?&]video(?:=|&|$)/.test(window.location.search);
    }
    function getInitialContentIndex() {
      var match = window.location.search.match(/[?&]video=([^&]*)/);
      if (!match) { return 0; }
      var requestedName;
      try { requestedName = decodeURIComponent(match[1].replace(/\+/g, ' ')); }
      catch (e) { requestedName = match[1]; }
      for (var i = 0; i < CONTENTS.length; i++) {
        if (CONTENTS[i].name === requestedName) { return i; }
      }
      log('Unknown video parameter: ' + requestedName + '; using ' + CONTENTS[0].name);
      return 0;
    }
    // Resol la URL de la web companion a absoluta (respecte a aquesta pàgina),
    // de manera que el contentIdOverride sigui una URL vàlida per al mòbil.
    function resolveContentId(c) {
      if (c && c.web) {
        try { return new URL(c.web, window.location.href).href; }
        catch (e) { return c.web; }
      }
      return c ? c.url : '';
    }
    function log(m) { console.log(m); }

    window.onload = function () {
      if (typeof hbbtvlib_initialize !== 'undefined') { hbbtvlib_initialize(); hbbtvlib_show(); }
      isVideoSelectionLocked = hasVideoQueryParameter();
      registerSeekKeys();
      contentIndex = getInitialContentIndex();
      var initialContent = CONTENTS[contentIndex];
      var source = v.querySelector('source');
      if (source) { source.src = initialContent.url; }
      log('Loading: ' + initialContent.name);
      v.addEventListener('canplay', onReady, { once: true });
      v.addEventListener('error', function () { console.error('Video error'); });
      v.load();
      v.play().catch(function (e) { console.error('Autoplay blocked: ' + e.message); });
    };

    function registerSeekKeys() {
      document.addEventListener('keydown', function (e) {
        var key = e.key || '';
        var code = e.keyCode || e.which;
        if (key === 'ArrowLeft' || code === 37) {
          seekBy(-SEEK_STEP_SECONDS);
          e.preventDefault();
          e.stopPropagation();
        } else if (key === 'ArrowRight' || code === 39) {
          seekBy(SEEK_STEP_SECONDS);
          e.preventDefault();
          e.stopPropagation();
        } else if (key === 'ArrowUp' || code === 38) {
          if (!isVideoSelectionLocked) { changeContent(1); }
          e.preventDefault();
          e.stopPropagation();
        } else if (key === 'ArrowDown' || code === 40) {
          if (!isVideoSelectionLocked) { changeContent(-1); }
          e.preventDefault();
          e.stopPropagation();
        }
      });
    }

    function changeContent(delta) {
      contentIndex = (contentIndex + delta + CONTENTS.length) % CONTENTS.length;
      var c = CONTENTS[contentIndex];
      log('Loading: ' + c.name);
      destroySync();
      var source = v.querySelector('source');
      if (source) { source.src = c.url; }
      v.addEventListener('canplay', function () {
        log('Playing: ' + c.name);
        initSync(resolveContentId(c));
      }, { once: true });
      v.load();
      v.play().catch(function (e) { console.error('Autoplay blocked: ' + e.message); });
    }

    function seekBy(deltaSeconds) {
      if (!v || v.readyState === 0) { return; }
      var target = v.currentTime + deltaSeconds;
      var minTime = 0;
      var maxTime = (isFinite(v.duration) && v.duration > 0) ? v.duration : null;
      if (v.seekable && v.seekable.length) {
        minTime = v.seekable.start(0);
        if (maxTime === null) { maxTime = v.seekable.end(v.seekable.length - 1); }
      }
      if (maxTime !== null) { target = Math.min(target, maxTime); }
      target = Math.max(minTime, target);
      try {
        v.currentTime = target;
        log('Seek ' + (deltaSeconds > 0 ? '+' : '') + deltaSeconds + 's -> ' + Math.floor(target) + 's');
      } catch (e) {
        console.error('Seek error: ' + e.message);
      }
    }

    var ms = null;
    // Track listeners registered via addEventListener so we can remove them on destroy.
    var msListeners = [];

    /**
     * Attach a MediaSynchroniser event handler in the safest way for the current terminal.
     * Some HbbTV terminals crash when a callback property (e.g. `ms.onSyncNowAchievable = fn`)
     * is assigned directly on the native embedded object. The HbbTV spec (2.0.1+) exposes the
     * same events via DOM2 addEventListener, where the event name is the intrinsic name without
     * the leading "on" (onSyncNowAchievable -> "SyncNowAchievable", onError -> "Error").
     * We prefer addEventListener and fall back to the property style (needed by the polyfill).
     */
    function addMsListener(target, intrinsicName, handler) {
      if (!target) { return; }
      if (typeof target.addEventListener === 'function') {
        var eventName = intrinsicName.replace(/^on/, '');
        target.addEventListener(eventName, handler);
        msListeners.push({ eventName: eventName, handler: handler });
      } else {
        target[intrinsicName] = handler;
      }
    }

    /** Remove every listener previously registered with addMsListener. */
    function removeMsListeners(target) {
      if (target && typeof target.removeEventListener === 'function') {
        for (var i = 0; i < msListeners.length; i++) {
          try { target.removeEventListener(msListeners[i].eventName, msListeners[i].handler); } catch (e) {}
        }
      }
      msListeners = [];
    }

    function onReady() {
      log('Video ready. Initialising sync...');
      initSync(resolveContentId(CONTENTS[contentIndex]));
    }

    function destroySync() {
      if (window.HbbTVMediaSyncCompat) {
        window.HbbTVMediaSyncCompat.stop();
      }
      if (!ms) { return; }
      try {
        removeMsListeners(ms);
        if (typeof ms.disableInterDeviceSync === 'function') {
          ms.disableInterDeviceSync();
          console.log('Inter-device sync desactivat (disableInterDeviceSync)');
        } else if (typeof ms.disableInterDevSync === 'function') {
          ms.disableInterDevSync();
          console.log('Inter-device sync desactivat (disableInterDevSync)');
        }
        if (typeof ms.removeMediaObject === 'function') {
          ms.removeMediaObject(v);
          console.log('Media object eliminat del MediaSynchroniser');
        }
      } catch (error) {
        console.warn('Error destruint MediaSynchroniser:', error);
      }
      ms = null;
    }

    function initSync(contentUrl) {
      try {
        log('Initialising MediaSynchroniser with contentIdOverride: ' + contentUrl + ' exist polyfill ' + !!window.HbbTVMediaSyncCompat);
        if (window.HbbTVMediaSyncCompat) {
          window.HbbTVMediaSyncCompat.start(v, { contentId: contentUrl });
        }
        if (typeof oipfObjectFactory === 'undefined') { log('No oipfObjectFactory'); return; }
        ms = oipfObjectFactory.createMediaSynchroniser();
        if (!ms) { console.error('createMediaSynchroniser failed'); return; }
        ms.contentIdOverride = contentUrl;
        if (/\.html?(\?|#|$)/i.test(contentUrl)) {
          log('Enviant web companion: ' + contentUrl);
        }
        addMsListener(ms, 'onSyncNowAchievable', function () { log('Sync now achievable'); });
        addMsListener(ms, 'onSyncNowUnachievable', function () { log('Sync now unachievable'); });
        addMsListener(ms, 'onInterDevSyncStatus', function (arg) {
          var st = (arg && arg.type) ? arg.status : arg;
          var map = { 0: 'disconnected', 1: 'connecting', 2: 'connected' };
          log('InterDev status: ' + (map[st] || st));
        });
        addMsListener(ms, 'onError', function (arg) {
          var code = (arg && arg.type) ? ms.lastError : arg;
          console.error('Sync error: ' + code);
        });
        ms.initMediaSynchroniser(v, 'urn:dvb:css:timeline:mpd:period:rel:1000');
        var en = (typeof ms.enableInterDeviceSync === 'function') ? ms.enableInterDeviceSync :
          (typeof ms.enableInterDevSync === 'function') ? ms.enableInterDevSync : null;
        if (en) {
          en.call(ms, function () { log('Inter-device sync enabled'); });
        } else {
          log('No enable method found');
        }
        log('MediaSynchroniser ready');
      } catch (e) { console.error('Sync init error: ' + e.message); }
    }

    window.addEventListener('unload', destroySync);
  </script>
</body>

</html>
